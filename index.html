<!-- <script> 섹션만 수정하여 적용하시면 됩니다 -->
<script>
    // 구역 데이터 정의
    const categories = [
        { id: 'blue', name: '🟦 주거지 (가장 큰 그룹)', color: '#3b82f6' },
        { id: 'yellow', name: '🟨 상업지 (따로 떨어진)', color: '#eab308' },
        { id: 'red', name: '🟥 병영 (가장자리 국경)', color: '#ef4444' },
        { id: 'purple', name: '🟪 신전 (완전히 둘러싸인)', color: '#8b5cf6' },
        { id: 'green', name: '🟩 정원 (모든 정원)', color: '#10b981' }
    ];

    let players = [
        { id: 1, name: '건축가 1', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false },
        { id: 2, name: '건축가 2', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false }
    ];

    const playersContainer = document.getElementById('players-container');
    const rankingList = document.getElementById('ranking-list');

    // 1. 계산 로직 (미션 완료 시 5점, 미완료 시 1점)
    function calculateTotal(player) {
        let score = 0;
        categories.forEach(cat => {
            score += (player.values[cat.id].star * player.values[cat.id].val);
        });
        const multiplier = player.stoneMission ? 5 : 1;
        score += (Number(player.stone) * multiplier);
        return score;
    }

    // 2. 랭킹 렌더링
    function renderRanking() {
        const rankedPlayers = [...players].map(p => ({ ...p, total: calculateTotal(p) }))
            .sort((a, b) => b.total - a.total || b.stone - a.stone);

        rankingList.innerHTML = rankedPlayers.map((p, idx) => `
            <div class="ranking-item rank-${idx + 1}">
                <div class="ranking-name">${idx + 1}위 · ${p.name}</div>
                <div class="ranking-score" id="rank-res-${p.id}">${p.total}점</div>
            </div>
        `).join('');
    }

    // 3. 플레이어 카드 렌더링
    function renderPlayers() {
        playersContainer.innerHTML = players.map(player => {
            let catHtml = categories.map(cat => {
                const data = player.values[cat.id];
                return `
                    <div class="category-row">
                        <div class="category-title" style="color: ${cat.color}">${cat.name}</div>
                        <div class="category-inputs">
                            ⭐별 <input type="number" min="0" value="${data.star}" oninput="updateValue(${player.id}, '${cat.id}', 'star', this.value)">
                            × ⬡타일 <input type="number" min="0" value="${data.val}" oninput="updateValue(${player.id}, '${cat.id}', 'val', this.value)">
                            <span class="category-result" id="res-${player.id}-${cat.id}">= ${data.star * data.val}점</span>
                        </div>
                    </div>`;
            }).join('');

            return `
                <div class="player-card">
                    <div class="player-header">
                        <input type="text" class="player-name-input" value="${player.name}" onchange="updateName(${player.id}, this.value)">
                        ${players.length > 1 ? `<button class="delete-player" onclick="deletePlayer(${player.id})">&times;</button>` : ''}
                    </div>
                    ${catHtml}
                    <div class="stone-row">
                        <div>
                            채석장 
                            <input type="number" min="0" value="${player.stone}" oninput="updateStone(${player.id}, this.value)" style="width:40px">
                            <label style="margin-left:8px; cursor:pointer">
                                <input type="checkbox" ${player.stoneMission ? 'checked' : ''} onchange="toggleMission(${player.id}, this.checked)"> 미션완료
                            </label>
                        </div>
                        <span id="stone-res-${player.id}">${player.stone * (player.stoneMission ? 5 : 1)}점</span>
                    </div>
                    <div class="total-row" id="total-${player.id}">
                        <span>총점</span>
                        <span>${calculateTotal(player)}점</span>
                    </div>
                </div>`;
        }).join('');
    }

    // 4. 전역 업데이트 함수 (화면 전체 갱신 없이 값만 변경)
    window.updateValue = (id, catId, field, val) => {
        const player = players.find(p => p.id === id);
        player.values[catId][field] = Number(val) || 0;
        document.getElementById(`res-${id}-${catId}`).innerText = `= ${player.values[catId].star * player.values[catId].val}점`;
        updateTotals(player);
    };

    window.updateStone = (id, val) => {
        const player = players.find(p => p.id === id);
        player.stone = Number(val) || 0;
        updateStoneDisplay(player);
        updateTotals(player);
    };

    window.toggleMission = (id, isChecked) => {
        const player = players.find(p => p.id === id);
        player.stoneMission = isChecked;
        updateStoneDisplay(player);
        updateTotals(player);
    };

    function updateStoneDisplay(player) {
        const score = player.stone * (player.stoneMission ? 5 : 1);
        document.getElementById(`stone-res-${player.id}`).innerText = `${score}점`;
    }

    function updateTotals(player) {
        document.getElementById(`total-${player.id}`).querySelector('span:last-child').innerText = `${calculateTotal(player)}점`;
        renderRanking();
    }

    window.deletePlayer = (id) => {
        players = players.filter(p => p.id !== id);
        renderPlayers();
        renderRanking();
    };

    // [기타 이벤트는 동일]
    document.getElementById('add-player-btn').addEventListener('click', () => {
        players.push({ id: Date.now(), name: `건축가 ${players.length + 1}`, values: { blue:{val:0,star:0}, yellow:{val:0,star:0}, red:{val:0,star:0}, purple:{val:0,star:0}, green:{val:0,star:0} }, stone: 0, stoneMission: false });
        renderPlayers();
        renderRanking();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm('초기화하시겠습니까?')) {
            players.forEach(p => { p.stone = 0; p.stoneMission = false; Object.keys(p.values).forEach(k => { p.values[k].val=0; p.values[k].star=0; }); });
            renderPlayers();
            renderRanking();
        }
    });

    renderPlayers();
    renderRanking();
</script>

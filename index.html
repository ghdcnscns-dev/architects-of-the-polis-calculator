<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폴리스의 건축가들 점수 계산기</title>
    <style>
        :root {
            --primary-color: #60a5fa;
            --bg-color: #1e293b;
            --card-bg: #334155;
            --border-color: #475569;
            --text-color: #f1f5f9;
            --input-bg: #1e293b;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }

        h1 { font-size: 1.5rem; margin: 0; color: #ffffff; }

        .actions { display: flex; gap: 10px; }

        button {
            cursor: pointer; padding: 8px 16px; font-size: 0.95rem; font-weight: 600;
            border-radius: 8px; border: none; transition: 0.2s;
        }

        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: #94a3b8; color: #1e293b; }
        .btn-danger:hover { background-color: #ef4444; color: white; }

        .scoreboard-summary {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px 20px; margin-bottom: 24px;
        }

        .scoreboard-summary h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 12px; color: #94a3b8; }

        .ranking-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }

        .ranking-item {
            background: #475569; padding: 10px 16px; border-radius: 8px;
            min-width: 140px; flex-shrink: 0; border-left: 4px solid #cbd5e1;
        }

        .ranking-item.rank-1 { border-left-color: #eab308; background: #451a03; }
        .ranking-name { font-weight: bold; font-size: 0.9rem; }
        .ranking-score { font-size: 1.2rem; font-weight: 800; color: #fff; margin-top: 2px; }

        .players-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }

        .player-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }

        .player-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .player-name-input {
            font-size: 1.1rem; font-weight: bold; border: 1px solid transparent;
            background: transparent; color: #fff; padding: 4px; border-radius: 4px; width: 130px;
        }

        .player-name-input:focus { border-color: #60a5fa; outline: none; }

        .delete-player { background: none; border: none; color: #94a3b8; cursor: pointer; }

        .category-row {
            background: #1e293b; padding: 8px 10px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .category-inputs input {
            width: 42px; padding: 4px; text-align: center;
            background: #334155; border: 1px solid var(--border-color);
            border-radius: 4px; color: #fff;
        }

        .category-result { margin-left: auto; font-weight: bold; color: #60a5fa; }

        .stone-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; font-weight: 600; }

        .total-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; padding: 10px 12px; border-radius: 8px;
            font-weight: 800; color: #60a5fa; font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏛️ 폴리스의 건축가들 실시간 점수 계산기</h1>
        <div class="actions">
            <button class="btn-primary" id="add-player-btn">+ 플레이어 추가</button>
            <button class="btn-danger" id="reset-btn">초기화</button>
        </div>
    </header>

    <div class="scoreboard-summary">
        <h2>🏆 실시간 순위 경쟁</h2>
        <div class="ranking-list" id="ranking-list"></div>
    </div>

    <div class="players-container" id="players-container"></div>
</div>

<script>
    const categories = [
        { id: 'blue', name: '🟦 주거지 (가장 큰 그룹)', color: '#60a5fa' },
        { id: 'yellow', name: '🟨 상업지 (따로 떨어진)', color: '#fbbf24' },
        { id: 'red', name: '🟥 병영 (가장자리 국경)', color: '#f87171' },
        { id: 'purple', name: '🟪 신전 (완전히 둘러싸인)', color: '#a78bfa' },
        { id: 'green', name: '🟩 정원 (모든 정원)', color: '#34d399' }
    ];

    let players = [
        { id: 1, name: '건축가 1', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false },
        { id: 2, name: '건축가 2', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false }
    ];

    const playersContainer = document.getElementById('players-container');
    const rankingList = document.getElementById('ranking-list');

    function calculateTotal(player) {
        let score = 0;
        categories.forEach(cat => { score += (player.values[cat.id].star * player.values[cat.id].val); });
        score += (Number(player.stone) * (player.stoneMission ? 5 : 1));
        return score;
    }

    function renderRanking() {
        const rankedPlayers = [...players].map(p => ({ ...p, total: calculateTotal(p) })).sort((a, b) => b.total - a.total);
        rankingList.innerHTML = rankedPlayers.map((p, idx) => `
            <div class="ranking-item ${idx===0 ? 'rank-1' : ''}">
                <div class="ranking-name">${idx + 1}위 · ${p.name}</div>
                <div class="ranking-score">${p.total}점</div>
            </div>
        `).join('');
    }

    function renderPlayers() {
        playersContainer.innerHTML = players.map(player => `
            <div class="player-card">
                <div class="player-header">
                    <input type="text" class="player-name-input" value="${player.name}" onchange="updateName(${player.id}, this.value)">
                    ${players.length > 1 ? `<button class="delete-player" onclick="deletePlayer(${player.id})">✕</button>` : ''}
                </div>
                ${categories.map(cat => `
                    <div class="category-row">
                        <div style="color:${cat.color}; font-size:0.85rem; font-weight:bold;">${cat.name}</div>
                        <div style="display:flex; align-items:center; gap:5px; font-size:0.85rem;">
                            별<input type="number" value="${player.values[cat.id].star}" oninput="updateValue(${player.id}, '${cat.id}', 'star', this.value)">
                            × 타일<input type="number" value="${player.values[cat.id].val}" oninput="updateValue(${player.id}, '${cat.id}', 'val', this.value)">
                            <span class="category-result" id="res-${player.id}-${cat.id}">= ${player.values[cat.id].star * player.values[cat.id].val}점</span>
                        </div>
                    </div>
                `).join('')}
                <div class="stone-row">
                    <div>채석장 <input type="number" value="${player.stone}" oninput="updateStone(${player.id}, this.value)" style="width:40px; background:#1e293b; color:#fff; border:1px solid #475569; text-align:center;">
                        <label style="font-size:0.8rem;"><input type="checkbox" ${player.stoneMission?'checked':''} onchange="toggleMission(${player.id}, this.checked)"> 미션</label>
                    </div>
                    <span id="stone-res-${player.id}">${player.stone * (player.stoneMission ? 5 : 1)}점</span>
                </div>
                <div class="total-row" id="total-${player.id}"><span>총점</span><span>${calculateTotal(player)}점</span></div>
            </div>
        `).join('');
    }

    window.updateName = (id, val) => { players.find(p=>p.id===id).name = val; renderRanking(); };
    window.updateValue = (id, cId, f, v) => {
        let p = players.find(p=>p.id===id); p.values[cId][f] = Number(v);
        document.getElementById(`res-${id}-${cId}`).innerText = `= ${p.values[cId].star * p.values[cId].val}점`;
        updateTotals(p);
    };
    window.updateStone = (id, v) => { let p = players.find(p=>p.id===id); p.stone = Number(v); updateStoneDisplay(p); updateTotals(p); };
    window.toggleMission = (id, c) => { let p = players.find(p=>p.id===id); p.stoneMission = c; updateStoneDisplay(p); updateTotals(p); };
    
    function updateStoneDisplay(p) { document.getElementById(`stone-res-${p.id}`).innerText = `${p.stone * (p.stoneMission ? 5 : 1)}점`; }
    function updateTotals(p) { document.getElementById(`total-${p.id}`).lastElementChild.innerText = `${calculateTotal(p)}점`; renderRanking(); }
    window.deletePlayer = (id) => { players = players.filter(p=>p.id!==id); renderPlayers(); renderRanking(); };
    document.getElementById('add-player-btn').onclick = () => { players.push({id:Date.now(), name:'건축가', values:{blue:{val:0,star:0},yellow:{val:0,star:0},red:{val:0,star:0},purple:{val:0,star:0},green:{val:0,star:0}}, stone:0, stoneMission:false}); renderPlayers(); renderRanking(); };
    document.getElementById('reset-btn').onclick = () => { if(confirm('초기화하시겠습니까?')) location.reload(); };

    renderPlayers(); renderRanking();
</script>
</body>
</html>

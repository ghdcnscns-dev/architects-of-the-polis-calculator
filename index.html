<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폴리스의 건축가들 점수 계산기</title>
    <style>
        :root {
            --primary-color: #60a5fa;
            --bg-color: #1e293b;
            --card-bg: #334155;
            --border-color: #475569;
            --text-color: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; gap: 8px;
        }

        h1 { font-size: 1.1rem; margin: 0; color: #ffffff; }

        .actions { display: flex; gap: 5px; }

        button {
            cursor: pointer; padding: 6px 12px; font-size: 0.85rem; font-weight: 600;
            border-radius: 6px; border: none;
        }

        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-danger { background-color: #94a3b8; color: #1e293b; }

        .scoreboard-summary {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; margin-bottom: 16px;
        }

        .scoreboard-summary h2 { font-size: 0.95rem; margin-top: 0; margin-bottom: 10px; color: #94a3b8; }

        .ranking-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }

        .ranking-item {
            background: #475569; padding: 8px 12px; border-radius: 8px;
            min-width: 100px; flex-shrink: 0; border-left: 4px solid #cbd5e1;
        }

        .ranking-item.rank-1 { border-left-color: #eab308; background: #451a03; }
        .ranking-name { font-weight: bold; font-size: 0.8rem; }
        .ranking-score { font-size: 1.1rem; font-weight: 800; color: #fff; }

        .main-layout { display: flex; flex-direction: column; gap: 15px; }

        .group-section {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }

        .group-title {
            font-size: 0.9rem; font-weight: bold; padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
        }

        .player-score-row {
            background: #1e293b; padding: 8px 10px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; gap: 8px;
        }

        .player-name-input-inline {
            font-size: 0.85rem; font-weight: bold; border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.05); color: #fff; width: 85px; padding: 4px 6px; border-radius: 4px;
        }
        .player-name-input-inline:focus {
            border-color: var(--primary-color); background: #334155; outline: none;
        }

        .inputs-group { display: flex; align-items: center; gap: 6px; }

        .inputs-group input {
            width: 38px; padding: 4px 0; text-align: center;
            background: #334155; border: 1px solid var(--border-color);
            border-radius: 4px; color: #fff; font-size: 0.85rem;
        }

        .calc-result { font-weight: bold; color: #60a5fa; width: 45px; text-align: right; }

        .players-manage-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }

        .players-manage-header { font-size: 0.9rem; font-weight: bold; color: #94a3b8; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }

        .player-manage-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; padding: 6px 10px; border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏛️ 폴리스 점수 계산기</h1>
        <div class="actions">
            <button class="btn-primary" id="add-player-btn">+ 인원 추가</button>
            <button class="btn-danger" id="reset-btn">초기화</button>
        </div>
    </header>

    <div class="scoreboard-summary">
        <h2>🏆 실시간 총합 순위</h2>
        <div class="ranking-list" id="ranking-list"></div>
    </div>

    <div class="main-layout" id="main-layout"></div>
</div>

<script>
    const categories = [
        { id: 'blue', name: '🟦 주거지 : 가장 큰 그룹안의 점수', color: '#60a5fa' },
        { id: 'yellow', name: '🟨 시장 : 따로 떨어진 점수', color: '#fbbf24' },
        { id: 'red', name: '🟥 병영 : 가장자리의 점수', color: '#f87171' },
        { id: 'purple', name: '🟪 신전 : 완전히 둘러싸인 점수', color: '#a78bfa' },
        { id: 'green', name: '🟩 정원 : 모든 점수', color: '#34d399' }
    ];

    let players = [
        { id: 1, name: '건축가 1', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false },
        { id: 2, name: '건축가 2', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false }
    ];

    const mainLayout = document.getElementById('main-layout');
    const rankingList = document.getElementById('ranking-list');

    function calculateTotal(player) {
        let score = 0;
        categories.forEach(cat => { score += (player.values[cat.id].star * player.values[cat.id].val); });
        score += (Number(player.stone) * (player.stoneMission ? 5 : 1));
        return score;
    }

    function renderRanking() {
        const rankedPlayers = [...players].map(p => ({ ...p, total: calculateTotal(p) })).sort((a, b) => b.total - a.total);
        rankingList.innerHTML = rankedPlayers.map((p, idx) => `
            <div class="ranking-item ${idx===0 ? 'rank-1' : ''}">
                <div class="ranking-name">${idx + 1}위 · ${p.name}</div>
                <div class="ranking-score">${p.total}점</div>
            </div>
        `).join('');
    }

    function renderApp() {
        renderRanking();

        let html = '';

        // 1. 각 그룹별 섹션 렌더링
        categories.forEach(cat => {
            html += `
                <div class="group-section">
                    <div class="group-title" style="color: ${cat.color};">${cat.name}</div>
                    ${players.map(player => `
                        <div class="player-score-row">
                            <input type="text" class="player-name-input-inline" value="${player.name}" oninput="updateName(${player.id}, this.value)">
                            <div class="inputs-group">
                                별<input type="number" value="${player.values[cat.id].star}" oninput="updateValue(${player.id}, '${cat.id}', 'star', this.value)">
                                타일<input type="number" value="${player.values[cat.id].val}" oninput="updateValue(${player.id}, '${cat.id}', 'val', this.value)">
                                <span class="calc-result" id="res-${player.id}-${cat.id}">${player.values[cat.id].star * player.values[cat.id].val}점</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        });

        // 2. 채석장 섹션 렌더링
        html += `
            <div class="group-section">
                <div class="group-title" style="color: #cbd5e1;">🪨 채석장 및 미션</div>
                ${players.map(player => `
                    <div class="player-score-row">
                        <input type="text" class="player-name-input-inline" value="${player.name}" oninput="updateName(${player.id}, this.value)">
                        <div class="inputs-group">
                            갯수<input type="number" value="${player.stone}" oninput="updateStone(${player.id}, this.value)">
                            <label style="font-size: 0.75rem; cursor: pointer;"><input type="checkbox" ${player.stoneMission ? 'checked' : ''} onchange="toggleMission(${player.id}, this.checked)"> 미션(5점)</label>
                            <span class="calc-result" id="stone-res-${player.id}">${player.stone * (player.stoneMission ? 5 : 1)}점</span>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

        // 3. 인원 삭제 관리 섹션 렌더링
        html += `
            <div class="players-manage-card">
                <div class="players-manage-header">👤 인원 삭제 관리</div>
                ${players.map(player => `
                    <div class="player-manage-row">
                        <span style="font-weight: bold; font-size: 0.9rem;">${player.name}</span>
                        ${players.length > 1 ? `<button class="delete-player" onclick="deletePlayer(${player.id})" style="background:none; color:#94a3b8; cursor:pointer;">✕ 삭제</button>` : '<span style="font-size:0.8rem; color:#94a3b8;">삭제 불가 (최소 1명)</span>'}
                    </div>
                `).join('')}
            </div>
        `;

        mainLayout.innerHTML = html;
    }

    window.updateName = (id, val) => {
        let p = players.find(p=>p.id===id);
        if(p) {
            p.name = val;
            renderRanking();
            // 입력 중에 포커스가 풀리지 않도록 전체 렌더링 대신 이름 인풋만 동기화하거나 렌더링 제어
            document.querySelectorAll(`input[oninput*="updateName(${id},"]`).forEach(input => {
                if (input.value !== val) input.value = val;
            });
        }
    };
    window.updateValue = (id, cId, f, v) => {
        let p = players.find(p=>p.id===id); p.values[cId][f] = Number(v);
        document.getElementById(`res-${id}-${cId}`).innerText = `${p.values[cId].star * p.values[cId].val}점`;
        renderRanking();
    };
    window.updateStone = (id, v) => {
        let p = players.find(p=>p.id===id); p.stone = Number(v);
        document.getElementById(`stone-res-${id}`).innerText = `${p.stone * (p.stoneMission ? 5 : 1)}점`;
        renderRanking();
    };
    window.toggleMission = (id, c) => {
        let p = players.find(p=>p.id===id); p.stoneMission = c;
        document.getElementById(`stone-res-${id}`).innerText = `${p.stone * (p.stoneMission ? 5 : 1)}점`;
        renderRanking();
    };
    window.deletePlayer = (id) => { players = players.filter(p=>p.id!==id); renderApp(); };
    
    document.getElementById('add-player-btn').onclick = () => { 
        players.push({id:Date.now(), name:`건축가 ${players.length + 1}`, values:{blue:{val:0,star:0},yellow:{val:0,star:0},red:{val:0,star:0},purple:{val:0,star:0},green:{val:0,star:0}}, stone:0, stoneMission:false}); 
        renderApp(); 
    };
    document.getElementById('reset-btn').onclick = () => { if(confirm('초기화하시겠습니까?')) location.reload(); };

    renderApp();
</script>
</body>
</html>

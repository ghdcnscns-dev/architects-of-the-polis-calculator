<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폴리스의 건축가들 점수 계산기</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #334155;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }

        h1 { font-size: 1.5rem; margin: 0; color: var(--primary-color); }

        .actions { display: flex; gap: 10px; }

        button {
            cursor: pointer; padding: 8px 16px; font-size: 0.95rem; font-weight: 600;
            border-radius: 8px; border: none; transition: background-color 0.2s;
        }

        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }

        .scoreboard-summary {
            background: white; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px 20px; margin-bottom: 24px;
        }

        .ranking-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }

        .ranking-item {
            background: #f1f5f9; padding: 10px 16px; border-radius: 8px;
            min-width: 140px; flex-shrink: 0; border-left: 4px solid #cbd5e1;
        }

        .ranking-item.rank-1 { border-left-color: #eab308; background: #fefce8; }

        .players-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
        }

        .player-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }

        .player-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .player-name-input { font-size: 1.1rem; font-weight: bold; border: none; background: transparent; width: 130px; }

        .category-row { background: #f8fafc; padding: 8px 10px; border-radius: 8px; }
        .category-title { font-size: 0.85rem; font-weight: 700; }
        .category-inputs { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .category-inputs input { width: 45px; padding: 4px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; }
        .category-result { margin-left: auto; font-weight: bold; color: #1e293b; }

        .stone-row { display: flex; flex-direction: column; gap: 8px; padding: 4px 10px; font-size: 0.9rem; font-weight: 600; }
        .stone-controls { display: flex; align-items: center; justify-content: space-between; }
        
        .total-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #eff6ff; padding: 10px 12px; border-radius: 8px;
            font-weight: 800; color: #1d4ed8; font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏛️ 폴리스의 건축가들 실시간 점수 계산기</h1>
        <div class="actions">
            <button class="btn-primary" id="add-player-btn">+ 플레이어 추가</button>
            <button class="btn-danger" id="reset-btn">초기화</button>
        </div>
    </header>

    <div class="scoreboard-summary">
        <h2>🏆 실시간 순위</h2>
        <div class="ranking-list" id="ranking-list"></div>
    </div>

    <div class="players-container" id="players-container"></div>
</div>

<script>
    const categories = [
        { id: 'blue', name: '🟦 주거지 (가장 큰 그룹)', color: '#3b82f6' },
        { id: 'yellow', name: '🟨 상업지 (따로 떨어진)', color: '#eab308' },
        { id: 'red', name: '🟥 병영 (가장자리 국경)', color: '#ef4444' },
        { id: 'purple', name: '🟪 신전 (완전히 둘러싸인)', color: '#8b5cf6' },
        { id: 'green', name: '🟩 정원 (모든 정원)', color: '#10b981' }
    ];

    let players = [
        { id: 1, name: '건축가 1', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false },
        { id: 2, name: '건축가 2', values: { blue: {val:0, star:0}, yellow: {val:0, star:0}, red: {val:0, star:0}, purple: {val:0, star:0}, green: {val:0, star:0} }, stone: 0, stoneMission: false }
    ];

    function calculateTotal(player) {
        let score = 0;
        categories.forEach(cat => { score += (player.values[cat.id].val * player.values[cat.id].star); });
        score += (player.stone * (player.stoneMission ? 5 : 1));
        return score;
    }

    function render() {
        const playersContainer = document.getElementById('players-container');
        const rankingList = document.getElementById('ranking-list');
        
        // 랭킹 렌더링
        const sorted = [...players].map(p => ({...p, total: calculateTotal(p)})).sort((a,b) => b.total - a.total);
        rankingList.innerHTML = sorted.map((p, i) => `<div class="ranking-item ${i==0?'rank-1':''}"><div>${i+1}위 ${p.name}</div><div style="font-weight:bold">${p.total}점</div></div>`).join('');

        // 카드 렌더링
        playersContainer.innerHTML = players.map(p => `
            <div class="player-card">
                <div class="player-header">
                    <input type="text" class="player-name-input" value="${p.name}" onchange="updateName(${p.id}, this.value)">
                    <button class="delete-player" onclick="deletePlayer(${p.id})">&times;</button>
                </div>
                ${categories.map(cat => `
                    <div class="category-row">
                        <div class="category-title" style="color:${cat.color}">${cat.name}</div>
                        <div class="category-inputs">
                            가치<input type="number" value="${p.values[cat.id].val}" oninput="updateVal(${p.id},'${cat.id}','val',this.value)">
                            × 별<input type="number" value="${p.values[cat.id].star}" oninput="updateVal(${p.id},'${cat.id}','star',this.value)">
                            <span class="category-result">= ${p.values[cat.id].val * p.values[cat.id].star}점</span>
                        </div>
                    </div>
                `).join('')}
                <div class="stone-row">
                    <div class="stone-controls">
                        <span>채석장(개당 ${p.stoneMission ? 5 : 1}점)</span>
                        <input type="number" value="${p.stone}" oninput="updateStone(${p.id}, this.value)">
                    </div>
                    <label><input type="checkbox" ${p.stoneMission ? 'checked' : ''} onchange="toggleMission(${p.id}, this.checked)"> 미션 달성 (5배)</label>
                </div>
                <div class="total-row"><span>총점</span><span>${calculateTotal(p)}점</span></div>
            </div>
        `).join('');
    }

    window.updateName = (id, val) => { players.find(p => p.id === id).name = val; render(); };
    window.updateVal = (id, catId, field, val) => { players.find(p => p.id === id).values[catId][field] = Number(val); render(); };
    window.updateStone = (id, val) => { players.find(p => p.id === id).stone = Number(val); render(); };
    window.toggleMission = (id, checked) => { players.find(p => p.id === id).stoneMission = checked; render(); };
    window.deletePlayer = (id) => { players = players.filter(p => p.id !== id); render(); };

    document.getElementById('add-player-btn').onclick = () => {
        players.push({ id: Date.now(), name: '건축가', values: { blue: {val:0,star:0}, yellow: {val:0,star:0}, red: {val:0,star:0}, purple: {val:0,star:0}, green: {val:0,star:0} }, stone: 0, stoneMission: false });
        render();
    };

    document.getElementById('reset-btn').onclick = () => { if(confirm('초기화하시겠습니까?')) location.reload(); };

    render();
</script>
</body>
</html>
